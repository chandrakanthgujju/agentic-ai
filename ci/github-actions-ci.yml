name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Synth needs an account/region to resolve; these are placeholders.
      # This workflow has no AWS credentials and never deploys.
      CDK_DEFAULT_ACCOUNT: "123456789012"
      CDK_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            services/*/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          npm install -g aws-cdk@2

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit and CDK assertion tests
        run: pytest

      - name: cdk synth (bundles Lambdas, runs cdk-nag)
        run: cdk synth --quiet
